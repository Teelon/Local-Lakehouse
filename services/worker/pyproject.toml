[project]
name = "lakehouse-worker"
version = "0.1.0"
description = "Asynchronous Data Ingestion and Local Lakehouse Processing Worker"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.8.0",
    "duckdb>=1.0.0",
    "pyarrow>=17.0.0",
    "boto3>=1.34.0",
    "httpx>=0.27.0",
    "psycopg2-binary>=2.9.9",
    "python-multipart>=0.0.9",
    "python-dotenv>=1.0.1",
    "pytest>=8.0.0"
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"
