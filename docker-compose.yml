# Complete Docker Compose for Local Lakehouse Architecture (MVP 1)
# Coolify-compliant: no custom network blocks, standard env bindings.

services:
  # 1. PostgreSQL 16 (Shared: payload_core + ducklake_catalog)
  postgres:
    image: postgres:16-alpine
    container_name: lakehouse-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-lakehouse_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-lakehouse_secret_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-lakehouse}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-scripts:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-lakehouse_admin} -d ${POSTGRES_DB:-lakehouse}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Object Storage (RustFS - S3 Compatible)
  storage:
    image: rustfs/rustfs:latest
    container_name: lakehouse-storage
    restart: unless-stopped
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ACCESS_KEY: ${S3_ROOT_USER:-lakehouse_storage_admin}
      RUSTFS_SECRET_KEY: ${S3_ROOT_PASSWORD:-storage_secret_change_me}
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_CONSOLE_ADDRESS: ":9001"
      RUSTFS_REGION: ${S3_REGION:-us-east-1}
      RUSTFS_BUFFER_PROFILE: DataAnalytics
    ports:
      - "${S3_PORT:-9000}:9000"
      - "${S3_CONSOLE_PORT:-9001}:9001"
    volumes:
      - storage_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 3. Processing Worker (Python + FastAPI + DuckDB)
  worker:
    build:
      context: ./services/worker
      dockerfile: Dockerfile
    container_name: lakehouse-worker
    restart: unless-stopped
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-lakehouse_admin}:${POSTGRES_PASSWORD:-lakehouse_secret_change_me}@postgres:5432/${POSTGRES_DB:-lakehouse}
      S3_ENDPOINT: http://storage:9000
      S3_ROOT_USER: ${S3_ROOT_USER:-lakehouse_storage_admin}
      S3_ROOT_PASSWORD: ${S3_ROOT_PASSWORD:-storage_secret_change_me}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-lakehouse-bucket}
    ports:
      - "${WORKER_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      storage:
        condition: service_healthy

  # 4. Operational Core (Next.js + Payload CMS + SQL Query Studio)
  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    container_name: lakehouse-web
    restart: unless-stopped
    environment:
      DATABASE_URI: postgres://${POSTGRES_USER:-lakehouse_admin}:${POSTGRES_PASSWORD:-lakehouse_secret_change_me}@postgres:5432/${POSTGRES_DB:-lakehouse}
      PAYLOAD_SECRET: ${PAYLOAD_SECRET:-dev_secret_key_1234567890}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      WORKER_URL: http://worker:8000
      S3_ENDPOINT: http://storage:9000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      worker:
        condition: service_started

volumes:
  postgres_data:
    driver: local
  storage_data:
    driver: local
